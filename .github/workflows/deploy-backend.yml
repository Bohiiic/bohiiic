name: Trigger backend deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend deploy hook
        if: ${{ secrets.BACKEND_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.BACKEND_DEPLOY_HOOK }}"
